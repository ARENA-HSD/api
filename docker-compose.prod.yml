services:
  # --- ELYSIA APP (PROD) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile # Production için olan, multi-stage Dockerfile
    container_name: arena-backend-prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_WARNING_TOPIC_ID=${TELEGRAM_WARNING_TOPIC_ID}
      - TELEGRAM_INFO_TOPIC_ID=${TELEGRAM_INFO_TOPIC_ID}
      - TELEGRAM_ERROR_TOPIC_ID=${TELEGRAM_ERROR_TOPIC_ID}
      - TELEGRAM_CRITICAL_TOPIC_ID=${TELEGRAM_CRITICAL_TOPIC_ID}
    # Production'da volumes ile kod bağlamıyoruz, kod imajın içine gömüldü.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arena-network
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: job=arena-backend-prod,env=production
    # Loglar doğrudan lokiye gider, console'a yazmaz.
    command: [ "bun", "run", "src/index.ts" ]

  # --- POSTGRES (PROD) ---
  postgres:
    image: postgres:15-alpine
    container_name: arena-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Production'da portları dışarı açmıyoruz, sadece API konteyneri erişebilir.
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - arena-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: job=arena-postgres-prod,env=production
    # Loglar doğrudan lokiye gider, console'a yazmaz.

    # --- REDIS (PROD) ---
  redis:
    image: redis:alpine
    container_name: arena-redis-prod
    restart: unless-stopped
    # Port mapping yok, sadece iç ağdan erişim.
    volumes:
      - redis_data_prod:/data
    networks:
      - arena-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: job=arena-redis-prod,env=production
    # Loglar doğrudan lokiye gider, console'a yazmaz.

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    container_name: arena-nginx-prod
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./config/nginx/private.cert.pem:/etc/nginx/ssl/private.cert.pem:ro
    networks:
      - arena-network
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: job=arena-nginx-prod,env=production
    # Loglar doğrudan lokiye gider, console'a yazmaz.

    # --- MONITORING (PROD) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: arena-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_prod:/prometheus
    networks:
      - arena-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: arena-blackbox
    restart: unless-stopped
    networks:
      - arena-network
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: job=arena-blackbox,env=production

  loki:
    image: grafana/loki:latest
    container_name: arena-loki
    restart: unless-stopped
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml
      - loki_data_prod:/loki
    networks:
      - arena-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:latest
    container_name: arena-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail_data_prod:/var/lib/promtail
    networks:
      - arena-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: arena-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data_prod:/var/lib/grafana
    networks:
      - arena-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  arena-network:
    name: arena-network
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  prometheus_data_prod:
  loki_data_prod:
  grafana_data_prod:
  promtail_data_prod:
