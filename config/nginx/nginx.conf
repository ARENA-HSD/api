server {
    listen 80;
    server_name quizstrike.com.tr *.quizstrike.com.tr;
    return 301 https://quizstrike.com.tr$request_uri;
}

server {
    listen 443 ssl;
    server_name quizstrike.com.tr *.quizstrike.com.tr;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.cert.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:5173;
        
        # Elysia WebSocket (/ws) desteği için gereken ayarlar
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Orijinal istemci IP ve başlıklarını taşı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

