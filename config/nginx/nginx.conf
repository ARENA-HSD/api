server {
    listen 80;
    server_name quizstrike.com.tr *.quizstrike.com.tr;
    return 301 https://quizstrike.com.tr$request_uri;
}

server {
    listen 443 ssl;
    server_name quizstrike.com.tr *.quizstrike.com.tr;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.cert.pem;

    # Protokoller: TLS v1.1 ve altını kesinlikle kapatıyoruz
    ssl_protocols TLSv1.2 TLSv1.3;

    # Şifreleme Setleri (Ciphers): 
    # Modern, hızlı ve güvenli olanları önceliklendiriyoruz.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Sunucunun şifreleme tercihlerine zorlanması
    ssl_prefer_server_ciphers off; # TLS 1.3 için 'off' önerilir, çünkü TLS 1.3 kendi sıralamasını yapar.

    # --- GÜVENLİK HEADERLARI ---
    # CSP: Kendi ihtiyaçlarına göre (API url, Google Fonts vb.) düzenle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://api.quizstrike.com.tr wss://api.quizstrike.com.tr; font-src 'self' https://fonts.gstatic.com;" always;
    
    # Diğer Tavsiye Edilen Güvenlik Headerları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # ---------------------------

    location / {
        proxy_pass http://frontend:80;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name tardis.quizstrike.com.tr;
    return 301 https://tardis.quizstrike.com.tr$request_uri;
}

server {
    listen 443 ssl;
    server_name tardis.quizstrike.com.tr;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.cert.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://grafana:3000;
        
        # Orijinal istemci IP ve başlıklarını taşı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.quizstrike.com.tr;
    return 301 https://api.quizstrike.com.tr$request_uri;
}

server {
    listen 443 ssl;
    server_name api.quizstrike.com.tr;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.cert.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://api:3000;
        
        # Elysia WebSocket (/ws) desteği için gereken ayarlar
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Orijinal istemci IP ve başlıklarını taşı
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}