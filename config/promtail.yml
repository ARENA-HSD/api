server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Sistem logları
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          service_name: varlogs
          __path__: /var/log/*log

  # Docker container logları — service_name ve job label'ları container adından türetiliyor
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Blackbox exporter loglarını tamamen düşür — log panelini şişiriyor
      - source_labels: ['__meta_docker_container_name']
        regex: '/arena-blackbox'
        action: drop

      # Container adını 'container' label'ına ata (başındaki / karakterini sil)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'container'

      # Container adını 'job' label'ına yansıt (Loki query uyumluluğu için)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'job'

      # Grafana Explore Logs (Drilldown) için kritik: service_name label'ı
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: 'service_name'

      # Docker Compose service adını ekle (opsiyonel, ek filtreleme için)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'

      # Docker imaj adını ekle
      - source_labels: ['__meta_docker_container_label_com_docker_compose_image']
        target_label: 'image'
