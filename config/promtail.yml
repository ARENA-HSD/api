server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Sistem logları
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          service_name: varlogs
          __path__: /var/log/*log

  # Docker container logları — service_name ve job label'ları container adından türetiliyor
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Monitoring araçlarının kendi loglarını düşür (Loki, Blackbox, Promtail)
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(arena-blackbox|arena-loki|arena-promtail|arena-prometheus)$'
        action: drop

      # Container adını 'container' label'ına ata
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.+)$'
        target_label: 'container'

      # Container adını 'job' label'ına yansıt (Loki query uyumluluğu için)
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.+)$'
        target_label: 'job'

      # Grafana Explore Logs (Drilldown) için asıl kritik etiketler! (OTel Standards)
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.+)$'
        target_label: 'service'
        
      - source_labels: ['__meta_docker_container_name']
        regex: '^/(.+)$'
        target_label: 'service_name'

      # Docker Compose service adını ekle (opsiyonel, ek filtreleme için)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'

      # Docker imaj adını ekle
      - source_labels: ['__meta_docker_container_label_com_docker_compose_image']
        target_label: 'image'

    # Pipeline: Backend container JSON loglarından org_subdomain label'ı çıkar
    pipeline_stages:
      # Sadece backend container loglarına uygula
      - match:
          selector: '{container=~"arena-backend.*"}'
          stages:
            # Drop errors if the log is not valid JSON
            - json:
                expressions:
                  org_subdomain: org_subdomain
                  level: level
                  event: event
                drop_invalid_labels: true
            # Sadece eşleşen ve boş olmayan değerleri label olarak ekler
            - labels:
                org_subdomain:
                level:
                event:
