global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    region: 'local'

scrape_configs:
  - job_name: 'arena-api'
    static_configs:
      - targets: ['api:3000']
        labels:
          env: 'prod'
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          env: 'prod'
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          env: 'prod'
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          env: 'prod'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          env: 'prod'

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://api:3000
        - http://frontend:80
        labels:
          env: 'prod'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
        - postgres:5432
        - redis:6379
        labels:
          env: 'prod'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
