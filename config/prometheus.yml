global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
  external_labels:
    region: 'local'
    environment: 'dev'

scrape_configs:
  - job_name: 'arena-api'
    static_configs:
      - targets: ['api:3000']
        labels:
          env: 'dev'
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          env: 'dev'
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          env: 'dev'
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          env: 'dev'
    