name: Deploy to Test Environment

on:
  push:
    branches:
      - test-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd api
          bun install

      - name: Run Tests
        run: |
          cd api
          bun test

      - name: Deploy to test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USERNAME }}
          key: ${{ secrets.TEST_SSH_KEY }}
          port: 29319
          script: |
            cd ~/git/api
            git pull origin test-production
            docker compose -f docker-compose.test.yml up -d --build --remove-orphans
